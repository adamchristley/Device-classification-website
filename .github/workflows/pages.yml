name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export HTTP_STATUS=$(curl --location --silent --output /tmp/site.html --write-out "%{http_code}" "$PAGE_URL")
          export PAGE_TITLE=$(grep -o '<title>[^<]*' /tmp/site.html | head -1 | sed 's/<title>//' || true)
          echo "Published URL: $PAGE_URL"
          echo "HTTP status: $HTTP_STATUS"
          echo "Page title: $PAGE_TITLE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("deployment-status.json").write_text(json.dumps({
              "url": os.environ["PAGE_URL"],
              "http_status": int(os.environ["HTTP_STATUS"]),
              "title": os.environ.get("PAGE_TITLE", ""),
              "verified": os.environ["HTTP_STATUS"] == "200",
          }, indent=2) + "\n")
          PY

      - name: Commit deployment record
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          git commit -m "Record deployed website URL [skip ci]" || exit 0
          git push
